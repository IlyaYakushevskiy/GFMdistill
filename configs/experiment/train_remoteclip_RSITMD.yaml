# @package _global_
### triaing remoteclip on FBP (requires 2 * 22GB GPU)

defaults:
  - /dataset: RSITMD
  - /encoder: remoteclip
  - /decoder: linearclassifier
  - /preprocessing: classification 
  - /criterion: cross_entropy
  - /task: linear_classification
  - _self_
  
#contr-intuitive, but this mode actually freezes encoder, ft true actually fts encoder and and the whole model
#train: true
#finetune: false 

train: true
finetune: true  

batch_size: 8
test_batch_size: 8

encoder: 
  encoder_weights: ./pretrained_models/RemoteCLIP-ViT-B-32.pt
  download_url: https://huggingface.co/chendelong/RemoteCLIP/resolve/main/RemoteCLIP-ViT-B-32.pt

task:
  evaluator:
    inference_mode: whole #instead of sliding, should use cropped images
    #sliding_inference_batch: 1

optimizer:
  #lr: 4e-4
  #since we do ft on out dataset RSTIMD and don't want to "forget" much from RemoteCLIP datasets -> use smaller lr
  lr: 1e-5

num_workers: 4
test_num_workers: 4

