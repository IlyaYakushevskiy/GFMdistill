# @package _global_
### triaing remoteclip on FBP (requires 2 * 22GB GPU)

defaults:
  - /dataset: RSITMD
  - /encoder: remoteclip ###TODO , now you must define two arch in diff files
  - /decoder: linearclassifier 
  - /preprocessing: classification 
  - /criterion: cross_entropy
  - /task: linear_classification
  - _self_
  

train: true
finetune: true 
batch_size: 8
test_batch_size: 2

#def arch of student
encoder: 
  #encoder_weights: false #initialise from scratch!! 
  encoder_weights: false 
  download_url: false #if false then init from scratch 
  embed_dim: 192
  input_size: 224
  layers: 12 #if edit -> change output layers too 
  width: 192
  head_width: 64 # 192 / 63 = 3 heads
  patch_size: 32
  mlp_ratio: 2.0


  input_bands:
    optical:
      - B4
      - B3
      - B2


  output_layers:
    - 3
    - 5
    - 7
    - 11

  output_dim: 192

task:
  evaluator:
    inference_mode: whole #instead of sliding, should use cropped images
    #sliding_inference_batch: 1
  trainer: 
    precision: fp32


num_workers: 4
test_num_workers: 4


optimizer:
  #lr: 4e-4
#since we do ft on out dataset RSTIMD and don't want to "forget" much from RemoteCLIP datasets -> use smaller lr
  lr: 1e-4