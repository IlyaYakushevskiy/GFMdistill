# @package _global_
### distill big model into small 


defaults:
  - /dataset: RSITMD
  - /encoder: remoteclip 
  - /decoder: linearclassifier
  - /preprocessing: classification 
  - /criterion: distillation
  - /task: linear_classification_distill
  - _self_
  
teacher_ckpt_dir : logs/(best)20250815_111136_remoteclip_linearclassifier_RSITMD_126cf6


train: true
finetune: true 
batch_size: 8
test_batch_size: 2

criterion: 
  _target_: utils.losses.DistillLogitLoss
  hard_loss_fn:
      _target_: utils.losses.WeightedCrossEntropy
      ignore_index: ${dataset.ignore_index}
      distribution: ${dataset.distribution}
  alpha: 0.3  # 30% weight on hard loss, 70% on soft loss
  temperature: 4.0 

# === STUDENT MODEL CONFIGURATION ===
encoder: 
  _target_: encoders.remoteclip_encoder.RemoteCLIP_Encoder
  encoder_weights: false #initialise from scratch!! 
  download_url: false   
  embed_dim: 512
  input_size: 224
  layers: 6
  width: 512
  head_width: 64
  patch_size: 32
  mlp_ratio: 2.0

  input_bands:
    optical:
      - B4
      - B3
      - B2


  output_layers:
    - 3
    - 4
    - 5

  output_dim: 512


# === TEACHER MODEL CONFIGURATION ===
#teacher_encoder: remoteclip_teacher
teacher_encoder: 
  _target_: encoders.remoteclip_encoder.RemoteCLIP_Encoder
  encoder_weights: false 
  download_url: false
  embed_dim: 768
  input_size: 224
  layers: 12
  width: 768
  head_width: 64
  patch_size: 32
  mlp_ratio: 4.0

  input_bands:
    optical:
      - B4
      - B3
      - B2


  output_layers:
    - 3
    - 5
    - 7
    - 11

  output_dim: 768
task:
  evaluator:
    inference_mode: whole #instead of sliding, should use cropped images
    #sliding_inference_batch: 1


num_workers: 0
test_num_workers: 0


optimizer:
  lr: 1e-5